; PlatformIO build config for the Spider Farmer GGS → Cultivar relay chain.
;
; Three ESPs, three roles, ONE codebase:
;   - env:shed    → reads BLE from AC5, sends data via ESP-NOW
;   - env:garage  → pure repeater, relays packets shed↔house
;   - env:house   → receives via ESP-NOW, uploads to Supabase via WiFi
;
; The role is selected at compile time via -DROLE_* in build_flags.
; Each env produces firmware.bin at .pio/build/<env>/firmware.bin.

[common]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=20
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
    -Wno-deprecated-declarations

build_unflags =
    -std=gnu++11

board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

; ── SHED: BLE collector ──────────────────────────────────────────────
[env:shed]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_speed    = ${common.upload_speed}
build_unflags   = ${common.build_unflags}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags     =
    ${common.build_flags}
    -DROLE_SHED=1
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    https://github.com/h2zero/NimBLE-Arduino.git#1.4.2

; ── GARAGE: pure repeater (smallest firmware) ────────────────────────
[env:garage]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_speed    = ${common.upload_speed}
build_unflags   = ${common.build_unflags}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags     =
    ${common.build_flags}
    -DROLE_GARAGE=1
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; ── HOUSE: WiFi + Supabase uploader ──────────────────────────────────
[env:house]
platform        = ${common.platform}
board           = ${common.board}
framework       = ${common.framework}
monitor_speed   = ${common.monitor_speed}
upload_speed    = ${common.upload_speed}
build_unflags   = ${common.build_unflags}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_flags     =
    ${common.build_flags}
    -DROLE_HOUSE=1
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17
