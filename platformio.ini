; PlatformIO build config for the Spider Farmer GGS AC5 → Supabase bridge
; Compiles to a single .bin for ESP-Web-Tools flashing

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ── Build flags ─────────────────────────────────────────────────────
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=20
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
    -Wno-deprecated-declarations

build_unflags =
    -std=gnu++11

; ── Partitions ──────────────────────────────────────────────────────
; Default partition table is fine - we don't need OTA for v1
board_build.partitions = default.csv
board_build.filesystem = littlefs

; ── Libraries ───────────────────────────────────────────────────────
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    tzapu/WiFiManager@^2.0.17
    https://github.com/h2zero/NimBLE-Arduino.git#1.4.2

; Use NimBLE instead of the heavy default BLE stack (saves ~60kB)
; Same API, much smaller footprint, more stable for long-running clients

; ── Output naming ───────────────────────────────────────────────────
; Final firmware lands at .pio/build/esp32dev/firmware.bin
; That's the file the user clicks to flash via ESP Web Tools
