name: Build firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run

      - name: Stage release binaries
        run: |
          mkdir -p release
          cp .pio/build/esp32dev/firmware.bin     release/ggs-bridge-esp32-firmware.bin
          cp .pio/build/esp32dev/bootloader.bin   release/ggs-bridge-esp32-bootloader.bin
          cp .pio/build/esp32dev/partitions.bin   release/ggs-bridge-esp32-partitions.bin
          find ~/.platformio/packages -name boot_app0.bin -exec cp {} release/ggs-bridge-esp32-boot_app0.bin \;
          ls -la release/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ggs-bridge-firmware
          path: release/
          retention-days: 90
